<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Intel Banner</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.25);
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --accent: #d4af37; /* Gold accent for premium feel */
            --bg-color: #0f172a; /* Deep dark slate */
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--bg-color) 0%, #000000 100%);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.15) 0%, transparent 50%);
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
            margin: 0;
            font-weight: 600;
        }

        /* ----- Floating Banner (Trigger) ----- */
        .match-banner {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            border-left: 1px solid var(--glass-highlight);
            border-radius: 50px;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 24px;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            overflow: hidden;
        }

        .match-banner::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-20deg);
            transition: 0.5s;
        }

        .match-banner:hover {
            transform: translateX(-50%) translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 15px 50px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.1);
        }

        .match-banner:hover::before {
            left: 150%;
        }

        .banner-content {
            display: flex;
            flex-direction: column;
        }

        .banner-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .banner-teams {
            font-size: 1.2rem;
            letter-spacing: 1px;
            font-family: 'Playfair Display', serif;
        }

        .banner-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--accent);
        }

        .banner-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* ----- Modal Overlay ----- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* ----- Modal Content (Glassmorphism) ----- */
        .modal-content {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.9));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            border-left: 1px solid var(--glass-highlight);
            border-radius: 24px;
            width: 90%;
            max-width: 500px;
            padding: 40px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.05);
            transform: translateY(30px) scale(0.95);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .modal-content::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 60%);
            pointer-events: none;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 2rem;
            cursor: pointer;
            transition: color 0.3s ease, transform 0.3s;
            z-index: 10;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
        }

        .close-btn:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.1);
            transform: rotate(90deg);
        }

        /* Match Info Styling */
        .match-header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .match-header h2 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            background: linear-gradient(to right, #ffffff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .venue-info {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            background: rgba(0,0,0,0.3);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            font-weight: 500;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .stat-card:hover {
            background: rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent);
            opacity: 0.7;
        }

        .stat-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: var(--accent);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* H2H Bar */
        .h2h-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: 500;
            font-size: 1.1rem;
        }
        
        .h2h-bar-wrapper {
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
            display: flex;
        }
        
        .h2h-bar-1 { background: #facc15; width: 44%; transition: width 1s ease-in-out; } /* CSK yellow */
        .h2h-bar-2 { background: #3b82f6; width: 56%; transition: width 1s ease-in-out; } /* MI blue */

        /* Win Probability */
        .prob-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .prob-team {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .prob-name {
            width: 40px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .prob-track {
            flex: 1;
            height: 14px;
            background: rgba(0,0,0,0.5);
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        .prob-fill {
            height: 100%;
            border-radius: 7px;
            position: relative;
            overflow: hidden;
            width: 0; /* Animated via JS */
            transition: width 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .prob-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        .prob-value {
            width: 45px;
            text-align: right;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: var(--accent);
            font-size: 1.1rem;
        }

        .fill-csk { background: linear-gradient(90deg, #ca8a04, #facc15); }
        .fill-mi { background: linear-gradient(90deg, #1d4ed8, #3b82f6); }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Decorative glowing orbs */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            z-index: -1;
            opacity: 0.3;
        }
        .orb-1 {
            width: 250px; height: 250px;
            background: #d4af37;
            top: -50px; left: -50px;
        }
        .orb-2 {
            width: 300px; height: 300px;
            background: #3b82f6;
            bottom: -100px; right: -50px;
        }

    </style>
</head>
<body>

    <!-- Bottom Floating Banner -->
    <div class="match-banner" id="openBanner">
        <div class="banner-content">
            <span class="banner-label">Upcoming Featured Match</span>
            <span class="banner-teams">CSK vs MI</span>
        </div>
        <div class="banner-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
    </div>

    <!-- Details Modal -->
    <div class="modal-overlay" id="matchModal">
        <div class="modal-content">
            <div class="glow-orb orb-1"></div>
            <div class="glow-orb orb-2"></div>
            
            <button class="close-btn" id="closeBanner" aria-label="Close">&times;</button>
            
            <div class="match-header">
                <h2>CSK <span style="color:var(--text-secondary);font-size:1.4rem;font-weight:300;">vs</span> MI</h2>
                <div class="venue-info">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    Wankhede Stadium, Mumbai
                </div>
            </div>

            <div class="stats-grid">
                <!-- Head to Head Section -->
                <div class="stat-card">
                    <div class="stat-title">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20v-8m0 0V4m0 8h8m-8 0H4"/></svg>
                        Previous Battles
                    </div>
                    <div class="h2h-container">
                        <span>CSK (16)</span>
                        <span style="color:var(--text-secondary);font-size:0.85rem;">36 Matches</span>
                        <span>MI (20)</span>
                    </div>
                    <div class="h2h-bar-wrapper">
                        <div class="h2h-bar-1"></div>
                        <div class="h2h-bar-2"></div>
                    </div>
                </div>

                <!-- Win Probability Section -->
                <div class="stat-card">
                    <div class="stat-title">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                        Likely Chances of Winning
                    </div>
                    <div class="prob-container">
                        <div class="prob-team">
                            <span class="prob-name">CSK</span>
                            <div class="prob-track">
                                <div class="prob-fill fill-csk" id="barCsk"></div>
                            </div>
                            <span class="prob-value">45%</span>
                        </div>
                        <div class="prob-team">
                            <span class="prob-name">MI</span>
                            <div class="prob-track">
                                <div class="prob-fill fill-mi" id="barMi"></div>
                            </div>
                            <span class="prob-value">55%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const banner = document.getElementById('openBanner');
        const modal = document.getElementById('matchModal');
        const closeBtn = document.getElementById('closeBanner');
        
        const barCsk = document.getElementById('barCsk');
        const barMi = document.getElementById('barMi');

        // Function to open modal and animate bars
        function openModal() {
            modal.classList.add('active');
            // Slight delay for smooth animation after modal opens
            setTimeout(() => {
                barCsk.style.width = '45%';
                barMi.style.width = '55%';
            }, 300);
        }

        // Function to close modal and reset bars
        function closeModal() {
            modal.classList.remove('active');
            setTimeout(() => {
                barCsk.style.width = '0%';
                barMi.style.width = '0%';
            }, 400); // Wait for modal to fade out
        }

        // Event Listeners
        banner.addEventListener('click', openModal);
        closeBtn.addEventListener('click', closeModal);

        // Close on outside click
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });
    </script>
</body>
</html>
